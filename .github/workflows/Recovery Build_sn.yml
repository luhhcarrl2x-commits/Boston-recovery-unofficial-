
name: Build PBRP Recovery for Moto G Stylus 5G 2024 (Boston)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: "PBRP manifest URL"
        required: true
        default: "https://github.com/PitchBlackRecoveryProject/manifest_pb.git"
      MANIFEST_BRANCH:
        description: "PBRP manifest branch"
        required: true
        default: "android-12.1"
      DEVICE_TREE_URL:
        description: "Boston device tree"
        required: true
        default: "https://github.com/PizzaG/android_device_motorola_boston.git"
      DEVICE_TREE_BRANCH:
        description: "Boston device-tree branch"
        required: true
        default: "TWRP"
      DEVICE_PATH:
        description: "Device tree path"
        required: true
        default: "device/motorola/boston"
      COMMON_TREE_URL:
        description: "Optional common tree URL; leave blank if not needed"
        required: false
        default: ""
      COMMON_PATH:
        description: "Optional common tree path"
        required: false
        default: "device/motorola/sm6450-common"
      DEVICE_NAME:
        description: "Device codename"
        required: true
        default: "boston"
      MAKEFILE_NAME:
        description: "Recovery lunch target prefix"
        required: true
        default: "twrp_boston"
      BUILD_JOBS:
        description: "Parallel build jobs"
        required: true
        type: choice
        options:
          - "2"
          - "4"
        default: "2"

permissions:
  contents: read

concurrency:
  group: boston-pbrp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      MANIFEST_URL: ${{ inputs.MANIFEST_URL }}
      MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
      DEVICE_TREE_URL: ${{ inputs.DEVICE_TREE_URL }}
      DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
      DEVICE_PATH: ${{ inputs.DEVICE_PATH }}
      COMMON_TREE_URL: ${{ inputs.COMMON_TREE_URL }}
      COMMON_PATH: ${{ inputs.COMMON_PATH }}
      DEVICE_NAME: ${{ inputs.DEVICE_NAME }}
      MAKEFILE_NAME: ${{ inputs.MAKEFILE_NAME }}
      BUILD_JOBS: ${{ inputs.BUILD_JOBS }}

    steps:
      - name: Check out workflow repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git git-lfs gnupg gperf \
            imagemagick lib32ncurses-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses-dev libssl-dev \
            libxml2 libxml2-utils lzop openjdk-11-jdk \
            pngcrush python3 rsync schedtool squashfs-tools \
            unzip xsltproc zip zlib1g-dev

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize manifest
        run: |
          mkdir -p "$GITHUB_WORKSPACE/workspace"
          cd "$GITHUB_WORKSPACE/workspace"

          git config --global user.name "Boston Recovery Builder"
          git config --global user.email "actions@github.com"

          repo init \
            --depth=1 \
            -u "$MANIFEST_URL" \
            -b "$MANIFEST_BRANCH"

      - name: Sync source
        working-directory: workspace
        run: |
          repo sync \
            -c \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j4

      - name: Clone Boston device tree
        working-directory: workspace
        run: |
          mkdir -p "$(dirname "$DEVICE_PATH")"
          git clone \
            --depth=1 \
            --single-branch \
            -b "$DEVICE_TREE_BRANCH" \
            "$DEVICE_TREE_URL" \
            "$DEVICE_PATH"

      - name: Clone optional common tree
        if: ${{ inputs.COMMON_TREE_URL != '' }}
        working-directory: workspace
        run: |
          test -n "$COMMON_PATH" || {
            echo "COMMON_PATH is required when COMMON_TREE_URL is set."
            exit 1
          }

          mkdir -p "$(dirname "$COMMON_PATH")"

          git clone \
            --depth=1 \
            "$COMMON_TREE_URL" \
            "$COMMON_PATH"

      - name: Check device configuration
        working-directory: workspace
        run: |
          test -f "$DEVICE_PATH/BoardConfig.mk" || {
            echo "::error::Boston BoardConfig.mk was not found."
            exit 1
          }

          test -f "$DEVICE_PATH/${MAKEFILE_NAME}.mk" || {
            echo "::error::Expected ${MAKEFILE_NAME}.mk was not found."
            echo "Check the device tree and MAKEFILE_NAME input."
            exit 1
          }

          test -f build/envsetup.sh || {
            echo "::error::The manifest did not provide build/envsetup.sh."
            exit 1
          }

          echo "Boston device tree files found."

      - name: Set swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Build recovery image
        working-directory: workspace
        run: |
          set -o pipefail
          export ALLOW_MISSING_DEPENDENCIES=true

          source build/envsetup.sh

          lunch "${MAKEFILE_NAME}-eng"

          mka recoveryimage -j"${BUILD_JOBS}" \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Verify recovery image
        if: always()
        run: |
          IMAGE="workspace/out/target/product/${DEVICE_NAME}/recovery.img"

          if [ -f "$IMAGE" ]; then
            ls -lh "$IMAGE"
            file "$IMAGE"
          else
            echo "Recovery image not found at $IMAGE"
            echo "Check the build log for the first actual error."
          fi

      - name: Upload recovery and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Boston-Recovery-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            workspace/out/target/product/boston/recovery.img
            workspace/out/target/product/boston/recovery.tar
            build.log
          retention-days: 7
