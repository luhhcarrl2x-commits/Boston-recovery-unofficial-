name: Recovery Build (Legacy) on: workflow_dispatch: inputs: MANIFEST_URL: description: "TWRP manifest URL" required: true default: "https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git" MANIFEST_BRANCH: description: "TWRP manifest branch" required: true default: "twrp-12.1" DEVICE_TREE_URL: description: "Boston device tree URL" required: true default: "https://github.com/PizzaG/android_device_motorola_boston.git" DEVICE_TREE_BRANCH: description: "Boston device tree branch" required: true default: "TWRP" DEVICE_PATH: description: "Device tree destination" required: true default: "device/motorola/boston" COMMON_TREE_URL: description: "Optional common device tree URL" required: false default: "" COMMON_TREE_BRANCH: description: "Optional common device tree branch" required: false default: "TWRP" COMMON_PATH: description: "Optional common device tree destination" required: false default: "" DEVICE_NAME: description: "Device codename" required: true default: "boston" MAKEFILE_NAME: description: "Lunch target prefix" required: true default: "twrp_boston" BUILD_TARGET: description: "Image target: recovery, boot, or vendorboot" required: true default: "recovery" type: choice options: - recovery - boot - vendorboot jobs: build: if: github.event.repository.owner.id == github.event.sender.id runs-on: ubuntu-22.04 timeout-minutes: 360 permissions: contents: write env: MANIFEST_URL: ${{ inputs.MANIFEST_URL }} MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }} DEVICE_TREE_URL: ${{ inputs.DEVICE_TREE_URL }} DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }} DEVICE_PATH: ${{ inputs.DEVICE_PATH }} COMMON_TREE_URL: ${{ inputs.COMMON_TREE_URL }} COMMON_TREE_BRANCH: ${{ inputs.COMMON_TREE_BRANCH }} COMMON_PATH: ${{ inputs.COMMON_PATH }} DEVICE_NAME: ${{ inputs.DEVICE_NAME }} MAKEFILE_NAME: ${{ inputs.MAKEFILE_NAME }} BUILD_TARGET: ${{ inputs.BUILD_TARGET }} steps: - name: Check out workflow repository uses: actions/checkout@v4 - name: Display build parameters run: | echo "Manifest: $MANIFEST_URL" echo "Manifest branch: $MANIFEST_BRANCH" echo "Device tree: $DEVICE_TREE_URL" echo "Device branch: $DEVICE_TREE_BRANCH" echo "Device path: $DEVICE_PATH" echo "Device: $DEVICE_NAME" echo "Lunch target: ${MAKEFILE_NAME}-eng" echo "Build target: ${BUILD_TARGET}image" - name: Install build dependencies run: | sudo apt-get update sudo apt-get install -y \ bc \ bison \ build-essential \ ccache \ curl \ flex \ g++-multilib \ gcc-multilib \ git \ git-lfs \ gnupg \ gperf \ imagemagick \ lib32ncurses-dev \ lib32readline-dev \ lib32z1-dev \ liblz4-tool \ libncurses-dev \ libssl-dev \ libxml2 \ libxml2-utils \ lzop \ openjdk-11-jdk \ pngcrush \ python3 \ rsync \ schedtool \ squashfs-tools \ unzip \ xsltproc \ zip \ zlib1g-dev - name: Configure Java uses: actions/setup-java@v4 with: distribution: temurin java-version: "11" - name: Install repo tool run: | mkdir -p "$HOME/bin" curl -fsSL \ https://storage.googleapis.com/git-repo-downloads/repo \ -o "$HOME/bin/repo" chmod +x "$HOME/bin/repo" echo "$HOME/bin" >> "$GITHUB_PATH" - name: Initialize source run: | mkdir -p workspace cd workspace git config --global user.name "GitHub Actions" git config --global user.email "actions@github.com" repo init \ --depth=1 \ -u "$MANIFEST_URL" \ -b "$MANIFEST_BRANCH" - name: Sync source working-directory: workspace run: | repo sync \ -c \ --no-clone-bundle \ --no-tags \ --optimized-fetch \ --prune \ -j4 - name: Clone Boston device tree working-directory: workspace run: | mkdir -p "$(dirname "$DEVICE_PATH")" if [ -e "$DEVICE_PATH" ]; then echo "Device tree destination already exists: $DEVICE_PATH" exit 1 fi git clone \ --depth=1 \ --single-branch \ --branch "$DEVICE_TREE_BRANCH" \ "$DEVICE_TREE_URL" \ "$DEVICE_PATH" test -f "$DEVICE_PATH/BoardConfig.mk" test -f "$DEVICE_PATH/${MAKEFILE_NAME}.mk" - name: Clone optional common tree if: ${{ inputs.COMMON_TREE_URL != '' && inputs.COMMON_PATH != '' }} working-directory: workspace run: | mkdir -p "$(dirname "$COMMON_PATH")" if [ -e "$COMMON_PATH" ]; then echo "Common tree destination already exists: $COMMON_PATH" exit 1 fi git clone \ --depth=1 \ --single-branch \ --branch "$COMMON_TREE_BRANCH" \ "$COMMON_TREE_URL" \ "$COMMON_PATH" - name: Validate build environment working-directory: workspace run: | test -f build/envsetup.sh echo "Available storage:" df -h . echo "Java version:" java -version echo "Python version:" python3 --version - name: Build recovery image working-directory: workspace shell: bash run: | set -eo pipefail source build/envsetup.sh export ALLOW_MISSING_DEPENDENCIES=true lunch "${MAKEFILE_NAME}-eng" mka "${BUILD_TARGET}image" -j2 2>&1 | tee build.log IMAGE="out/target/product/${DEVICE_NAME}/${BUILD_TARGET}.img" if [ ! -f "$IMAGE" ]; then echo "ERROR: Expected image was not created: $IMAGE" find "out/target/product/${DEVICE_NAME}" \ -maxdepth 2 -type f \ \( -name "*.img" -o -name "*.zip" \) \ -print || true exit 1 fi echo "Build successful: $IMAGE" - name: Upload build artifacts if: always() uses: actions/upload-artifact@v4 with: name: Boston-Recovery-Build-${{ github.run_number }} path: | workspace/out/target/product/${{ inputs.DEVICE_NAME }}/${{ inputs.BUILD_TARGET }}.img workspace/out/target/product/${{ inputs.DEVICE_NAME }}/*.zip workspace/out/target/product/${{ inputs.DEVICE_NAME }}/*vendor*.img workspace/build.log if-no-files-found: warn retention-days: 7 - name: Publish GitHub release if: success() uses: softprops/action-gh-release@v2 with: tag_name: boston-recovery-${{ github.run_id }} name: Boston Recovery Build ${{ github.run_number }} target_commitish: ${{ github.sha }} files: | workspace/out/target/product/${{ inputs.DEVICE_NAME }}/${{ inputs.BUILD_TARGET }}.img workspace/out/target/product/${{ inputs.DEVICE_NAME }}/*.zip workspace/out/target/product/${{ inputs.DEVICE_NAME }}/*vendor*.img fail_on_unmatched_files: false body: | Automated recovery build. Device: ${{ inputs.DEVICE_NAME }} Manifest branch: ${{ inputs.MANIFEST_BRANCH }} Device tree branch: ${{ inputs.DEVICE_TREE_BRANCH }} Build target: ${{ inputs.BUILD_TARGET }}image Workflow run: ${{ github.run_id }} env: GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 